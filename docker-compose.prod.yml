version: "3.8"

# Production Docker Compose for ikopilot.com
# Runs alongside robustidps.ai on the same server (different ports)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    expose:
      - "8001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ikopilot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    expose:
      - "3001"
    environment:
      - VITE_API_URL=https://ikopilot.com
    networks:
      - ikopilot-net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikopilot-net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata_prod:/data
    networks:
      - ikopilot-net

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ikopilot-net

volumes:
  pgdata_prod:
  redisdata_prod:

networks:
  ikopilot-net:
    driver: bridge
